      <stop offset="0" stop-color="#1CC8DC"/>
      <stop offset="1" stop-color="#0A5A86"/>
    </linearGradient>
  </defs>
  <g transform="translate(0 2) scale(1.0)">
    <path d="M100 192 C84 168 34 136 34 86 A66 66 0 1 1 166 86 C166 136 116 168 100 192 Z" fill="url(#pinGradI)"/>
    <circle cx="100" cy="86" r="47" fill="#FFFFFF"/>
